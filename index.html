<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mime - Virgile Chorlet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #071c3d;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

#presentation {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#page {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

button {
    position: fixed;
    bottom: 20px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(7,28,61,0.75);
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
}

#prev {
    left: 20px;
}

#next {
    right: 20px;
}

button:hover {
    background: #d5ad43;
    color: #071c3d;
}

#counter {
    position: fixed;
    bottom: 33px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font: 12px Arial;
}

@media(max-width:600px) {
    button {
        bottom: 12px;
    }

    #prev {
        left: 12px;
    }

    #next {
        right: 12px;
    }

    #counter {
        bottom: 25px;
    }
}
</style>
</head>

<body>

<div id="presentation">

    <img id="page" src="page1.jpg"
         alt="Présentation de Virgile Chorlet">

    <button id="prev" onclick="change(-1)">←</button>

    <button id="next" onclick="change(1)">→</button>

    <div id="counter">1 / 5</div>

</div>

<script>

const images = [
    "page1.jpg",
    "page2.jpg",
    "page3.jpg",
    "page4.jpg",
    "page5.jpg"
];

let current = 0;

function showPage() {
    document.getElementById("page").src =
        images[current];

    document.getElementById("counter").textContent =
        (current + 1) + " / 5";
}

function change(direction) {
    current = (current + direction + images.length)
        % images.length;

    showPage();
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight") change(1);
    if (e.key === "ArrowLeft") change(-1);
});

</script>

</body>
</html>
