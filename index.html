<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site internet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        /* Affichage ordinateur */
        #pdf-viewer {
            display: block;
            width: 100%;
            height: 100vh;
            border: none;
        }

        /* Affichage smartphone */
        .mobile-view {
            display: none;
        }

        @media screen and (max-width: 768px) {

            #pdf-viewer {
                display: none;
            }

            .mobile-view {
                display: flex;
                min-height: 100vh;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 25px;
                text-align: center;
                font-family: Arial, sans-serif;
            }

            .mobile-view a {
                display: inline-block;
                margin-top: 20px;
                padding: 16px 25px;
                background: #222222;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <!-- Version ordinateur -->
    <iframe
        id="pdf-viewer"
        src="présentation.pdf"
        title="Présentation PDF">
    </iframe>

    <!-- Version smartphone -->
    <div class="mobile-view">
        <h2>Bienvenue</h2>

        <p>
            Consultez ma présentation en cliquant
            sur le bouton ci-dessous.
        </p>

        <a href="présentation.pdf" target="_blank">
            Consulter ma présentation
        </a>
    </div>

</body>
</html>
