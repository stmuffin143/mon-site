<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mime - Virgile Chorlet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #071c3d;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

#presentation {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Zone de présentation au format 16:9 */
#canvas {
    position: relative;
    width: min(100vw, 177.7778vh);
    aspect-ratio: 16 / 9;
    flex-shrink: 0;
}

#page {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Photo interactive : LE MIME */
#hotspot-mime {
    position: absolute;
    left: 63.8%;
    top: 1.5%;
    width: 11%;
    height: 12%;
    z-index: 5;
    cursor: pointer;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
}

/* Flèches */
button.nav {
    position: fixed;
    bottom: 20px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(7,28,61,0.75);
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
}

#prev {
    left: 20px;
}

#next {
    right: 20px;
}

button.nav:hover {
    background: #d5ad43;
    color: #071c3d;
}

#counter {
    position: fixed;
    bottom: 33px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font: 12px Arial;
    z-index: 10;
}

@media(max-width:600px) {
    button.nav {
        bottom: 12px;
    }

    #prev {
        left: 12px;
    }

    #next {
        right: 12px;
    }

    #counter {
        bottom: 25px;
    }
}

/* Réseaux sociaux */
.reseaux-sociaux {
    position: fixed;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 9999;
}

.reseaux-sociaux a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.reseaux-sociaux img {
    width: 21px;
    height: 21px;
}

@media (max-width: 600px) {
    .reseaux-sociaux {
        right: 8px;
        gap: 14px;
    }

    .reseaux-sociaux a {
        width: 32px;
        height: 32px;
    }

    .reseaux-sociaux img {
        width: 18px;
        height: 18px;
    }
}
</style>
</head>

<body>

<div id="presentation">

    <div id="canvas">

        <img id="page" src="page1.jpg"
             alt="Présentation de Virgile Chorlet">

        <!-- CLIC SUR LA PHOTO LE MIME -->
        <button id="hotspot-mime"
                type="button"
                aria-label="Accéder à la page 2"
                onclick="goToPage(1)">
        </button>

    </div>

    <button class="nav" id="prev"
            onclick="change(-1)">←</button>

    <button class="nav" id="next"
            onclick="change(1)">→</button>

    <div id="counter">1 / 5</div>

</div>

<script>

const images = [
    "page1.jpg",
    "page2.jpg",
    "page3.jpg",
    "page4.jpg",
    "page5.jpg"
];

let current = 0;

function showPage() {
    document.getElementById("page").src =
        images[current];

    document.getElementById("counter").textContent =
        (current + 1) + " / 5";
}

function goToPage(number) {
    current = number;
    showPage();
}

function change(direction) {
    current = (current + direction + images.length)
        % images.length;

    showPage();
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight") change(1);
    if (e.key === "ArrowLeft") change(-1);
});

</script>

<!-- Réseaux sociaux -->
<div class="reseaux-sociaux">

    <a href="https://www.instagram.com/nanocharlot/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
        <img src="https://cdn.simpleicons.org/instagram"
             alt="Instagram">
    </a>

    <a href="https://www.facebook.com/search/top?q=Virgile%20Nano%20Charlot"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Facebook">
        <img src="https://cdn.simpleicons.org/facebook"
             alt="Facebook">
    </a>

    <a href="mailto:virgile_mimo@yahoo.fr"
       aria-label="Envoyer un email">
        <img src="https://cdn.simpleicons.org/maildotru"
             alt="Email">
    </a>

</div>

</body>
</html>
